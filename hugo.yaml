    Title: "Eyal Weiss"
    Subtitle: >
      *Postdoctoral researcher | AI & Robotics | Planning, Search & Optimization*
      <br>*Robotics Institute, Carnegie Mellon University*
    Content: >
      **What I'm passionate about:** AI and robotics, particularly through the lens of planning, search and control.


      <br>


      I am a postdoc at the [Robotics Institute](https://www.ri.cmu.edu/) at
      Carnegie Mellon University, affiliated with the
      [Search-based Planning Laboratory (SBPL)](https://www.ri.cmu.edu/robotics-groups/search-based-planning-laboratory/)
      led by [**Prof. Maxim Likhachev**](https://www.cs.cmu.edu/~maxim/) and the
      [ARCS Lab](https://arcs-group.github.io/) led by
      [**Prof. Jiaoyang Li**](https://jiaoyangli.me/).
      My current research spans Search, AI Planning, Motion Planning for robotics, and Combinatorial Optimization.
      I am particularly interested in planning with learned skills and models: learned robot skills offer
      a scalable and general path toward ever more capable robots, and planning is what composes them into
      reliable, long-horizon behavior.


      ---


      Prior to joining CMU I was a postdoc at the
      [Computational Robotics Lab (CRL)](https://crl.cs.technion.ac.il/)
      led by [**Prof. Oren Salzman**](https://orensalzman.com/), in the
      [CS Faculty at the Technion](https://cs.technion.ac.il/).


      ---


      I had the privilege to conduct my PhD under the supervision of
      [**Prof. Gal A. Kaminka**](https://u.cs.biu.ac.il/~kaminkg/), affiliated with the
      [MAVERICK](https://u.cs.biu.ac.il/~kaminkg/maverick/) research group, in the
      [CS department at BIU](https://cs.biu.ac.il/).
      My research was, and partially still is, devoted to generalizing automated planning
      with dynamically estimated action models, where we combined tools from AI planning,
      graph theory and combinatorial optimization, to endow agents with enhanced planning
      capabilities in challenging (non-classical) setups.


      ---


      Previously, I earned my BSc and MSc in Electrical Engineering at Tel Aviv University,
      where I was fortunate to work with
      [**Prof. Michael Margaliot**](https://sites.google.com/view/michael-margaliot-homepage/home),
      in the [EE school at TAU](https://en-engineering.tau.ac.il/School-of-Electrical-Engineering/main),
      on problems in the fields of control theory and dynamical systems.


      📄 [My complete CV](/cv.pdf)

